<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>과제 페이지</title>
    <style>
        html {

            scroll-behavior: smooth;
        }


        /*상단 스티키 메뉴 설정*/
        sticky-nav {
            position: sticky;
            top: 0;
            /*화면 맨 위에 도달하면 고정한다.*/
            background-color: #ffffff;
            border-bottom: 2px solid #ddd;
            z-index: 1000;
        }

        .sticky-nav ul {
            display: flex;
            list-style: none;
            margin: 0;
            padding: 0;
        }

        .sticky-nav li {
            flex: 1;
            text-align: center;
        }

        .sticky-nav a {
            display: block;
            padding: 15px 0;
            text-decoration: none;
            color: #333;
            font-weight: bold;
        }

        .sticky-nav a:hover {
            background-color: #f0f0f0;
            color: #007bff;
        }
    </style>
</head>

<body>
<nav class="sticky-nav">
        <ul>
            <li><a href="#desc">상품설명</a></li>
            <li><a href="#detail">상세정보</a></li>
            <li><a href="#review">후기</a></li>
            <li><a href="#qna">문의</a></li>
        </ul>
    </nav>

    <!-- 각 콘텐츠 영역 -->
    <section id="desc">
        <h2>상품설명</h2>
        <img src="">
        <p>여기는 상품 설명 영역입니다.</p>
    </section>

    <section id="detail">
        <h2>상세정보</h2>
        <p>여기는 상세정보 영역입니다.</p>
    </section>

    <section id="review">
        <h2>후기</h2>
        <p>여기는 구매 후기 영역입니다.</p>
    </section>

    <section id="qna">
        <h2>문의</h2>
        <p>여기는 상품 문의 영역입니다.</p>
    </section>
</body>

</html>
