<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>과제 페이지</title>
    <style>
        html {

            scroll-behavior: smooth;
        }


        /*상단 스티키 메뉴 설정*/
        sticky-nav {
            position: sticky;
            top: 0;
            /*화면 맨 위에 도달하면 고정한다.*/
            background-color: #ffffff;
            border-bottom: 2px solid #ddd;
            z-index: 1000;
        }

        .sticky-nav ul {
            display: flex;
            list-style: none;
            margin: 0;
            padding: 0;
        }

        .sticky-nav li {
            flex: 1;
            text-align: center;
        }

        .sticky-nav a {
            display: block;
            padding: 15px 0;
            text-decoration: none;
            color: #333;
            font-weight: bold;
        }

        .sticky-nav a:hover {
            background-color: #f0f0f0;
            color: #007bff;
        }

        /*figure의 너비를 지정한다.*/
        figure img {
            width: 100%;
            height: auto;
        }
    </style>
</head>

<body>
    <nav class="sticky-nav">
        <ul>
            <li><a href="#desc">상품설명</a></li>
            <li><a href="#detail">상세정보</a></li>
            <li><a href="#review">후기</a></li>
            <li><a href="#qna">문의</a></li>
        </ul>
    </nav>

    <!-- 각 콘텐츠 영역 -->
    <section id="desc">
        <h2>상품설명</h2>
        <!--시멘틱 태그 활용-->
        <figure>
            <img src="image/tum_1.jpg" alt="상품 대표 이미지">
            <figcaption>
                <!--브랜드 슬로건-->
                
                <strong class="product-title">Playful Modular Life</strong>

                <!--제품명-->
                <br/>
                <small class="brand-slogan">루프 텀블러 모듈 591ml</small>

                <!--본문-->
                <p class="product-desc">
                    루프 텀블러 모듈은 나의 취향과 일상에 맞춰 완성하는 새로운 루프 시리즈입니다.
                    넉넉한 <span>591ml(20oz) 용량</span>으로 사무실, 캠퍼스, 장시간 외출 등
                    충분한 음용량이 필요한 순간에도 여유롭게 사용할 수 있으며,
                    필요한 파츠를 조합해 나만의 텀블러로 확장할 수 있습니다.
                </p>
            </figcaption>
        </figure>
    </section>

    <section id="detail">
        <h2>상세정보</h2>
        <p>여기는 상세정보 영역입니다.</p>
    </section>

    <section id="review">
        <h2>후기</h2>
        <p>여기는 구매 후기 영역입니다.</p>
    </section>

    <section id="qna">
        <h2>문의</h2>
        <p>여기는 상품 문의 영역입니다.</p>
    </section>
</body>

</html>
